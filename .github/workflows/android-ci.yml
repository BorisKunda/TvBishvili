# Name shown in the "Actions" tab on GitHub.
name: MMovies Android CI

# WHEN does this workflow start?
on:
  # Only when code lands in master (a merge). Pushes to other branches start nothing.
  push:
    branches: [master]
  # When a pull request is created (opened), gets new commits (synchronize) or is reopened.
  # "closed" is not listed: the merge itself causes a push to master, which is handled above.
  pull_request:
    types: [opened, synchronize, reopened]

# What the workflow is allowed to do with your repo. "read" = look at the code only, never change it.
permissions:
  contents: read

# Avoid running the same thing twice at once.
# group = one "lane" per workflow + event + pull request (or branch).
# A new commit on a pull request cancels the older run of that same pull request.
# Runs on master are never cancelled, so two quick merges cannot cancel each other's tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A workflow is a list of JOBS. Each job runs on its own fresh virtual machine.
# Jobs run at the same time unless one says "needs" another.
jobs:

  # JOB 1: lint = checks the code for common mistakes and bad practices.
  lint:
    # The machine type: a Linux (Ubuntu) computer provided by GitHub.
    runs-on: ubuntu-latest
    # Kill the job if it takes longer than 30 minutes (protects against hangs).
    timeout-minutes: 30

    # STEPS run one after another, top to bottom. If one fails, the rest are skipped.
    steps:
      # "uses" = run a ready-made action written by someone else (like importing a library).
      # checkout = copy your repository's code onto the fresh machine (it starts empty).
      - name: Download source code
        uses: actions/checkout@v7

      # Install Java 21, which Gradle needs to build Android apps.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        # "with" = settings passed to the action.
        with:
          distribution: temurin
          java-version: '21'

      # Install the Android SDK (the tools and libraries Android builds require).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Prepare Gradle and cache its downloads so later runs are faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # app/google-services.json is private, so it is not in git.
      # It is stored as a GitHub "secret" and written back to a file here.
      - name: Restore Firebase configuration
        # "env" = environment variable for this step, filled from the repository secret.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # "run" = type shell commands (bash on Ubuntu). The "|" lets you write several lines.
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # The real work of this job: run Android lint through Gradle.
      - name: Run Android lint
        run: bash ./gradlew :app:lintDebug --stacktrace

      # Upload the lint report so you can download it from the run page.
      - name: Save lint report
        # always() = do this even if the lint step above failed (that is when you want the report).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MMovies-lint-report
          path: app/build/reports/lint-results-debug.*
          # Only warn (do not fail) if the report file was not created.
          if-no-files-found: warn
          # GitHub deletes the file after 7 days to save space.
          retention-days: 7

  # JOB 2: build = checks that the mobile and TV apps compile and produces APK files.
  # It has no "needs", so it runs at the same time as lint.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The same setup steps as in lint (each job is a new machine, so setup repeats).
      - name: Download source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Build the debug APK of both modules: :app (phone) and :tv.
      - name: Build mobile and TV debug APKs
        run: bash ./gradlew :app:assembleDebug :tv:assembleDebug --stacktrace

      # Upload the built APKs so you can download and install them.
      - name: Save mobile APK for download
        uses: actions/upload-artifact@v7
        with:
          name: MMovies-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          # Here a missing APK is an error: the build step should have made it.
          if-no-files-found: error
          retention-days: 7

      - name: Save TV APK for download
        uses: actions/upload-artifact@v7
        with:
          name: MMovies-tv-debug
          path: tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # JOB 3: unit-test = runs every JVM test (app/src/test and core/src/test). No emulator needed.
  # It has no "needs", so it runs at the same time as lint and build.
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Robolectric downloads its simulated Android jar into ~/.m2, which the Gradle cache does not cover.
      # Pull requests only READ this cache. Only runs on master SAVE it.
      - name: Restore Robolectric Android jars cache
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      # Run the JVM tests of every module (plain JVM and Robolectric).
      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Save Robolectric Android jars cache (master only)
        if: github.event_name == 'push' && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      # Save the test reports even when tests failed (that is when you want them).
      - name: Save unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MMovies-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            core/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7

  # JOB 4: all-tests-passed = one summary result for the merge gate.
  # It waits for lint, build and unit-test and fails if any of them did not succeed.
  # Add "all-tests-passed" to the master ruleset's required status checks (GitHub website).
  all-tests-passed:
    name: all-tests-passed
    # Wait for every job above.
    needs: [lint, build, unit-test]
    # always() = run even when a job above failed, so this job can report red instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail unless lint, build and unit tests passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
        run: |
          echo "lint: $LINT_RESULT"
          echo "build: $BUILD_RESULT"
          echo "unit-test: $TEST_RESULT"
          if [ "$LINT_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "Something did not pass."
            exit 1
          fi
